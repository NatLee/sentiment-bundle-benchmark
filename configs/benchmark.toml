# ---------------------------------------------------------------- dataset options

[dataset_options.myanimelist]
# GURA's rule: an overall rating of 6 or more out of 10 counts as positive.
positive_min_rating = 6
# Reviews posted from this date on form the test pool, older ones the training pool.
test_from = "2018-01-01"

# ---------------------------------------------------------------- methods
# kind = tfidf | embedding | finetune | llm. Model revisions are pinned to Hub commits.

[[methods]]
name = "tfidf-logreg"
label = "TF-IDF + logistic regression"
kind = "tfidf"
ngram_max = 2
min_df = 2
max_features = 200000
# liblinear is the fast choice for sparse features with two classes.
solver = "liblinear"
c_grid = [0.25, 1.0, 4.0, 16.0]

[[methods]]
name = "granite-small-r2-logreg"
label = "granite-embedding-small-r2 (47M, frozen) + LR"
kind = "embedding"
model = "ibm-granite/granite-embedding-small-english-r2"
revision = "2ab6fa8ea2d674564defd37171ae19079b864b33"
max_length = 512
batch_size = 64
prompt = ""
c_grid = [0.1, 1.0, 10.0, 100.0]

[[methods]]
name = "qwen3-embedding-0.6b-logreg"
label = "Qwen3-Embedding-0.6B (frozen) + LR"
kind = "embedding"
model = "Qwen/Qwen3-Embedding-0.6B"
revision = "97b0c614be4d77ee51c0cef4e5f07c00f9eb65b3"
max_length = 512
batch_size = 32
# Qwen3-Embedding expects a one-line task instruction in front of the text.
prompt = "Instruct: {task}\nQuery: "
c_grid = [0.1, 1.0, 10.0, 100.0]

[[methods]]
name = "modernbert-base-ft"
label = "ModernBERT-base, fine-tuned"
kind = "finetune"
model = "answerdotai/ModernBERT-base"
revision = "8949b909ec900327062f0ebf497f51aef5e6f0c8"
max_length = 512
batch_size = 16
epochs = 2
learning_rate = 5e-5
weight_decay = 0.01
warmup_ratio = 0.06

[[methods]]
name = "deberta-v3-base-ft"
label = "DeBERTa-v3-base, fine-tuned"
kind = "finetune"
model = "microsoft/deberta-v3-base"
revision = "8ccc9b6f36199bec6961081d44eb72fb3f7353f3"
max_length = 512
# DeBERTa attention needs more memory than ModernBERT; batches of 8 keep it under 8 GB of VRAM.
batch_size = 8
epochs = 2
learning_rate = 2e-5
weight_decay = 0.01
warmup_ratio = 0.06

[[methods]]
name = "qwen3.5-2b-zero-shot"
label = "Qwen3.5-2B, zero-shot"
kind = "llm"
model = "Qwen/Qwen3.5-2B"
revision = "15852e8c16360a2fea060d615a32b45270f8a8fc"
shots = 0
max_input_tokens = 512
batch_size = 16

[[methods]]
name = "qwen3.5-2b-8-shot"
label = "Qwen3.5-2B, 8-shot"
kind = "llm"
model = "Qwen/Qwen3.5-2B"
revision = "15852e8c16360a2fea060d615a32b45270f8a8fc"
shots = 8
# Each example in the prompt is cut to this many tokens so long reviews still fit.
max_demo_tokens = 96
max_input_tokens = 512
batch_size = 8
