# The configuration behind the numbers in the README.
# Every random choice (subsampling, splits, few-shot examples, fine-tuning) uses `seed`.

seed = 42
data_dir = "data"
results_dir = "results"
datasets = ["myanimelist", "imdb", "sst2", "mr", "subj", "mpqa"]
# scikit-learn and BLAS start one thread per core. On a shared machine that oversubscribes the CPU
# and made the TF-IDF fits up to 100x slower, so the CPU work is capped.
cpu_threads = 4

[splits]
# Big sets are subsampled (stratified) so the whole run fits in about three GPU-hours.
max_train = 25000
max_val = 2000
max_test = 5000
# Used only when a dataset has no official split of that kind.
val_fraction = 0.1
test_fraction = 0.2

# ---------------------------------------------------------------- sources
# Files are downloaded once into <data_dir>/raw and checked against these SHA-256 sums.
# Each dataset uses the first layout whose files one of these sources lists (Parquet first, see
# datasets.py). The Parquet bundle gives exactly the same rows as the older files below, so the
# split fingerprints in results/splits.json hold either way.

[sources.bundle]
description = "NatLee/sentiment-classification-dataset-bundle on the Hugging Face Hub, Parquet revision (November 2026)"
url = "https://huggingface.co/datasets/NatLee/sentiment-classification-dataset-bundle/resolve/REVISION_PENDING_UPLOAD/{file}"

